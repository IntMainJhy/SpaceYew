<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕的海边骑行</title>
<style>
:root{color-scheme:light;--paper:#f6f1e5;--ink:#283f3c;--muted:#5c6c62;--orange:#c15b38}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Songti SC",STSong,Georgia,serif;min-height:100svh;display:grid;place-items:center}main{width:min(1100px,100%);padding:48px 32px 28px}header{display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:0 28px}h1{font-size:clamp(28px,4vw,46px);font-weight:500;letter-spacing:-.03em;margin:0}header p{font-size:15px;color:var(--muted);margin:0;line-height:1.8}svg.scene{width:100%;height:auto;display:block;overflow:hidden}footer{margin:4px 28px 0;padding-top:22px;border-top:1px solid #c9ccbb;display:flex;align-items:center;justify-content:space-between;gap:20px}.controls{display:flex;gap:12px;align-items:center}button{font:inherit;font-size:15px;min-height:44px;padding:10px 20px;border:1px solid var(--ink);border-radius:24px;background:var(--ink);color:var(--paper);cursor:pointer}button:hover{background:#405b50}button:focus-visible,select:focus-visible{outline:3px solid var(--orange);outline-offset:5px}label{font-size:14px}select{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid #8e9d8c;min-height:44px;cursor:pointer;padding:8px}footer p{font-size:14px;color:var(--muted);margin:0}::selection{background:#edd197;color:var(--ink)}@media(max-width:600px){main{padding:32px 12px 24px}header{display:block;padding:0 14px}header p{margin-top:12px}svg.scene{margin:20px 0;min-height:290px}footer{margin:0 14px;align-items:flex-start;flex-direction:column;gap:14px}.controls{flex-wrap:wrap}}
</style>
</head>
<body>
<main>
<header><h1>今天，慢慢骑。</h1><p>一只鹈鹕，一辆单车，一路海风。</p></header>
<svg class="scene" viewBox="0 0 1000 620" role="img" aria-labelledby="scene-title scene-desc" xmlns="http://www.w3.org/2000/svg">
<title id="scene-title">鹈鹕的海边骑行</title><desc id="scene-desc">戴着绿色小帽、系着橙色围巾的白色鹈鹕骑着绿色自行车。双脚交替踩踏，车轮旋转，远处是太阳、海面与缓缓移动的云。</desc>
<defs>
<clipPath id="landscape"><rect x="35" y="30" width="930" height="520" rx="220"/></clipPath>
<g id="cloud" fill="#fffaf0"><path d="M0 23 C-6 7 12-2 25 7 C33-13 63-8 65 10 C85 0 102 15 94 25Z"/></g>
<g id="spokes" stroke="#b1b9a4" stroke-width="2"><path d="M-74 0H74 M0-74V74 M-52-52L52 52 M-52 52L52-52 M-28-68L28 68 M-68-28L68 28 M-68 28L68-28 M-28 68L28-68"/></g>
<g id="grass" fill="none" stroke="#7f9174" stroke-width="3" stroke-linecap="round"><path d="M0 0Q-3-16-12-22 M0 0Q4-22 13-29 M0 0Q12-11 21-10"/></g>
</defs>
<g clip-path="url(#landscape)">
<path fill="#e4eddf" d="M0 0H1000V550H0Z"/>
<circle cx="747" cy="147" r="62" fill="#edc16b"/>
<g id="clouds"><use href="#cloud" x="144" y="135"/><use href="#cloud" x="480" y="82" transform="scale(.8)"/><use href="#cloud" x="864" y="200"/></g>
<path fill="#b7cfc0" d="M0 320Q135 293 270 320T540 316T810 312T1080 320V452H0Z"/>
<g fill="none" stroke="#e9f0df" stroke-width="3" stroke-linecap="round"><path d="M90 347H172 M230 376H300 M695 352H789 M833 391H932 M435 344H485"/></g>
<path fill="#d5debd" d="M0 412Q166 385 347 415T693 413T1000 407V550H0Z"/>
<path fill="#e8d8b5" d="M0 471Q430 450 1000 477V620H0Z"/>
<path d="M0 479Q500 462 1000 482" fill="none" stroke="#d3c39e" stroke-width="2"/>
<g id="road" stroke="#c4b28e" stroke-width="3" stroke-linecap="round"><path d="M0 520H35 M175 501H205 M345 533H392 M550 508H576 M720 529H765 M910 503H938 M1000 520H1035 M1175 501H1205 M1345 533H1392 M1550 508H1576 M1720 529H1765 M1910 503H1938"/></g>
<g id="plants"><use href="#grass" x="130" y="468"/><use href="#grass" x="828" y="465"/><use href="#grass" x="1130" y="468"/><use href="#grass" x="1828" y="465"/></g>
</g>
<ellipse cx="493" cy="517" rx="234" ry="13" fill="#5e7350" opacity=".12"/>
<g id="rider" stroke="#304943" stroke-linecap="round" stroke-linejoin="round">
<!-- Wheels and mechanically connected bicycle frame. -->
<g transform="translate(337 430)"><circle r="79" fill="#f6f1e5" stroke-width="10"/><circle r="72" fill="none" stroke="#d9c9a6" stroke-width="3"/><g id="rear-spokes"><use href="#spokes"/></g><circle r="7" fill="#304943" stroke="none"/></g>
<g transform="translate(659 430)"><circle r="79" fill="#f6f1e5" stroke-width="10"/><circle r="72" fill="none" stroke="#d9c9a6" stroke-width="3"/><g id="front-spokes"><use href="#spokes"/></g><circle r="7" fill="#304943" stroke="none"/></g>
<path id="far-leg" d="M472 320L507 359L487 413" fill="none" stroke="#b47c43" stroke-width="13"/>
<path id="far-foot" d="M477 413H505" fill="none" stroke="#c68c47" stroke-width="13"/>
<path d="M337 430L421 323L478 430H337L583 327L659 430 M421 323L583 327 M478 430L421 323" fill="none" stroke="#477d69" stroke-width="10"/>
<path d="M421 323L412 301 M583 327L569 276Q568 268 581 267H611" fill="none" stroke-width="8"/>
<path d="M390 301H435" stroke-width="12"/><path d="M597 267H617" stroke="#b56b45" stroke-width="11"/>
<path d="M478 415H367Q350 430 367 445H478Q494 430 478 415Z" fill="none" stroke="#9aab8a" stroke-width="3"/>
<circle cx="478" cy="430" r="17" fill="#f6f1e5" stroke-width="4"/>
<g id="crank" transform="translate(478 430)"><path d="M-29 0H29" stroke-width="5"/></g>
<!-- Tail, body, long neck, and the unmistakable pelican bill pouch. -->
<path d="M390 278Q351 282 333 261L375 257L345 239Q390 237 414 259" fill="#fdf9e9" stroke-width="3"/>
<path d="M397 230C371 249 371 291 406 311C432 329 480 324 506 296C526 274 514 255 522 231C528 213 544 199 543 173C543 146 518 135 498 148C475 162 478 189 479 209C478 235 440 211 397 230Z" fill="#fffbed" stroke-width="3.5"/>
<path d="M498 194C492 216 493 241 480 254" fill="none" stroke="#d7dcc7" stroke-width="12"/>
<path d="M411 241C425 230 465 242 487 263C507 280 535 272 570 268C556 292 512 309 480 291C459 279 432 286 411 270" fill="#e4e7d3" stroke-width="3"/>
<path d="M418 255Q448 257 462 270 M414 265Q436 273 449 275" fill="none" stroke="#bdc8b1" stroke-width="2"/>
<path d="M531 179L674 189Q630 246 573 227Q539 219 531 190Z" fill="#ecc16c" stroke-width="3"/>
<path d="M531 176Q602 172 682 186Q685 191 672 194L533 193Z" fill="#e6a451" stroke-width="3"/>
<path d="M548 201Q584 229 624 211" fill="none" stroke="#d7a34f" stroke-width="2"/>
<circle cx="518" cy="167" r="4.5" fill="#304943" stroke="none"/><circle cx="519" cy="166" r="1.2" fill="white" stroke="none"/>
<path d="M486 151Q483 121 506 119Q529 117 537 144" fill="#477d69" stroke-width="3"/><path d="M478 150Q511 139 549 150" fill="none" stroke-width="6"/>
<path d="M486 214Q503 224 522 220L520 234Q499 239 481 228Z" fill="#cb7048" stroke-width="2"/>
<path id="scarf" d="M487 224Q455 211 426 222L437 232L425 243Q456 231 486 237Z" fill="#cb7048" stroke-width="2"/>
<path id="near-leg" d="M458 310L440 369L507 430" fill="none" stroke="#dfa955" stroke-width="14"/>
<path id="near-foot" d="M497 430H527" fill="none" stroke="#e6b35d" stroke-width="14"/>
<path id="near-pedal" d="M494 439H524" fill="none" stroke-width="5"/>
</g>
<g fill="none" stroke="#7e9380" stroke-width="2.5" stroke-linecap="round"><path d="M239 242H285 M251 261H271 M223 281H265"/></g>
</svg>
<footer><div class="controls"><button id="toggle" type="button" aria-pressed="false">暂停骑行</button><label for="speed">速度</label><select id="speed"><option value="0.65">悠闲</option><option value="1" selected>轻快</option><option value="1.6">追风</option></select></div><p id="status" role="status">海风正好，不赶时间。</p></footer>
</main>
<script>
(() => {
  const get = id => document.getElementById(id);
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  let paused = motion.matches, speed = 1, elapsed = 0, previous = null, frame = null;
  const set = (id, value) => get(id).setAttribute('transform', value);
  function render(t) {
    const angle = t * Math.PI * 2 / 1.6;
    const x = Math.cos(angle) * 29, y = Math.sin(angle) * 29;
    set('rear-spokes', `rotate(${t * 150})`);
    set('front-spokes', `rotate(${t * 150})`);
    set('crank', `translate(478 430) rotate(${angle * 180 / Math.PI})`);
    // Both feet stay attached to opposite ends of the crank throughout the cycle.
    for (const [side, direction] of [['near', 1], ['far', -1]]) {
      const fx = 478 + x * direction, fy = 430 + y * direction;
      const hx = side === 'near' ? 458 : 472, hy = side === 'near' ? 310 : 320;
      const dx = fx - hx, dy = fy - hy, distance = Math.hypot(dx, dy);
      const bend = Math.sqrt(Math.max(0, 76 * 76 - distance * distance / 4));
      const kneeX = (hx + fx) / 2 - dy / distance * bend;
      const kneeY = (hy + fy) / 2 + dx / distance * bend;
      get(`${side}-leg`).setAttribute('d', `M${hx} ${hy}L${kneeX} ${kneeY}L${fx} ${fy}`);
      get(`${side}-foot`).setAttribute('d', `M${fx - 9} ${fy}H${fx + 19}`);
      if (side === 'near') get('near-pedal').setAttribute('d', `M${fx - 12} ${fy + 8}H${fx + 18}`);
    }
    set('rider', `translate(0 ${Math.sin(angle * 2) * 1.5})`);
    set('scarf', `rotate(${Math.sin(angle * 1.5) * 5} 486 228)`);
    set('road', `translate(${-t * 130 % 1000} 0)`);
    set('plants', `translate(${-t * 90 % 1000} 0)`);
    set('clouds', `translate(${-Math.sin(t / 20) * 42} 0)`);
  }
  function tick(now) {
    if (previous !== null) elapsed += Math.min((now - previous) / 1000, .05) * speed;
    previous = now;
    render(elapsed);
    frame = requestAnimationFrame(tick);
  }
  function sync() {
    cancelAnimationFrame(frame); previous = null;
    get('toggle').textContent = paused ? '继续骑行' : '暂停骑行';
    get('toggle').setAttribute('aria-pressed', String(paused));
    get('status').textContent = paused ? '歇一会儿，看看海。' : '海风正好，不赶时间。';
    if (!paused && !document.hidden) frame = requestAnimationFrame(tick);
  }
  get('toggle').addEventListener('click', () => { paused = !paused; sync(); });
  get('speed').addEventListener('change', event => { speed = Number(event.target.value); });
  document.addEventListener('visibilitychange', sync);
  motion.addEventListener('change', event => { paused = event.matches; sync(); });
  render(0); sync();
})();
</script>
</body>
</html>
